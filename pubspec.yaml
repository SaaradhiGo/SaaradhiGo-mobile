name: vahango
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_polyline_points: ^3.1.0
  go_router: ^17.1.0
  google_fonts: ^8.0.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  http: ^1.6.0
  image_picker: ^1.2.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.4
  # Keychain (iOS) / Keystore (Android) for auth tokens. flutter_secure_storage
  # replaces the plain-text shared_preferences storage we used to keep
  # access/refresh tokens in; SharedPreferences is still used for non-secret
  # state and as a dual-write fallback until every reader migrates.
  flutter_secure_storage: ^9.2.2
  uuid: ^4.5.3
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_map_cancellable_tile_provider: ^2.0.0
  geolocator: ^14.0.2
  flutter_svg: ^2.0.17
  web_socket_channel: ^3.0.3
  shimmer: ^3.0.0
  intl: ^0.19.0
  flutter_local_notifications: ^21.0.0
  flutter_background_service: ^5.1.0
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  auto_size_text: ^3.0.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  cached_network_image_ce: ^4.6.4
  flutter_cashfree_pg_sdk: ^2.3.4+51
  js: ^0.6.7
  # Used to launch tel: links so the driver phone number opens in the
  # OS dialer without ever being displayed in our UI. Privacy posture:
  # the raw phone number stays out of the widget tree; the only thing
  # that touches it is launchUrl(Uri.parse('tel:$number')).
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.6.3
  build_runner: ^2.13.0
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/.env
    - assets/markers/
