# Secret scan for the RIDER app (12 Nov): the same gitleaks check the driver app, the
# backend and the web run, so main here is protected exactly as in web (CI + secret scan +
# source branch). It scans the commits a push or pull request introduces, not old history.
name: secret scan

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks over the commits this run introduces
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            RANGE="$HEAD~1..$HEAD"
          else
            RANGE="$BASE..$HEAD"
          fi
          echo "scanning $RANGE"
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.21.2             git /repo --config /repo/.gitleaks.toml --log-opts="$RANGE"             --redact --no-banner --exit-code 1
