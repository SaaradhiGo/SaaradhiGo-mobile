# Static analysis and unit tests for the RIDER app.
#
# This repository had no CI, so its ~48 existing tests had never been run
# automatically -- the rider half of a two-sided product was the less-verified half.
# The driver app got CI first; this brings the rider app to the same footing so
# changes to booking, payment and trip state are checked on every push.
#
# `flutter test` needs no secrets and no assets/.env: AppConfig falls back to the QA
# host in debug builds, which is exactly what a test binary is.
name: flutter

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Formatting is checked but not enforced as a failure: a reformat of the
      # whole tree is a separate, reviewable change, not something CI should
      # spring on an unrelated commit.
      - name: Check formatting (informational)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter expanded

  # A build is a different gate from a test.
  #
  # `flutter test` runs on the Dart VM and proves nothing about whether the app
  # compiles for Android: a missing plugin, a Gradle/AGP mismatch, a manifest
  # error or a NDK problem all pass `flutter test` and fail on a device. The
  # previous readiness review had to record "no APK has been produced" as a
  # launch blocker, because the only machine with a toolchain could not build one
  # (Windows requires Developer Mode for the plugin symlinks). A Linux runner has
  # no such restriction.
  #
  # Debug build, deliberately:
  #   * it needs no signing secrets, so this job works on a fork and in a PR;
  #   * android/app/build.gradle.kts already falls back to the debug signing
  #     config when key.properties is absent, so a release build here would be
  #     debug-signed anyway and the name would mislead;
  #   * a store-signed artifact is a release decision, not a CI default.
  #
  # google-services.json is committed, so Firebase messaging links without a
  # secret. The artifact is for technical verification and install-on-a-handset
  # testing. It is NOT a store artifact and must not be submitted.
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Report artifact size
        # A sudden jump in size is usually an accidentally bundled asset.
        run: ls -lh build/app/outputs/flutter-apk/

      - uses: actions/upload-artifact@v4
        with:
          name: rider-debug-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # Proves the release-signing configuration is correct WITHOUT holding a
  # keystore or a password.
  #
  # Two assertions, in the only order that means anything:
  #
  #   1. A release build with no signing material must FAIL. That is the
  #      regression guard. The release build type used to fall back to the
  #      Android DEBUG key silently, which produces an APK that installs and
  #      runs and that Play rejects -- and nothing in test, analyze or even a
  #      successful `flutter build apk` noticed.
  #
  #   2. The documented escape hatch must still work. `-PallowDebugSigning=true`
  #      is how a developer builds a release APK locally, and if the guard
  #      blocked that too it would just get deleted by the next person.
  #
  # No secret is used, referenced or needed here. When a real keystore is added
  # as a secret, give it its own job -- do not weaken this one, because this is
  # the job that proves the guard is still there.
  release-config:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: An unsigned release build must be refused
        run: |
          set +e
          output=$(flutter build apk --release 2>&1)
          code=$?
          set -e
          echo "$output" | tail -40

          if [ $code -eq 0 ]; then
            echo "::error::A release APK built with NO signing material. The \
          guard in android/app/build.gradle.kts is not working, and this \
          artifact is signed with the Android debug key."
            exit 1
          fi

          if ! echo "$output" | grep -q "Release build refused"; then
            echo "::error::The release build failed, but not with the \
          signing guard's message. Something else is broken -- read the log \
          above rather than assuming the guard fired."
            exit 1
          fi

          echo "An unsigned release build was refused, with the expected message."

      - name: A release build with the documented opt-out must succeed
        run: flutter build apk --release -PallowDebugSigning=true

      - name: Confirm the opt-out APK is debug-signed, and say so loudly
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          ls -lh "$apk"
          # `apksigner` ships with the Android SDK build-tools on the runner.
          signer=$(find "$ANDROID_HOME" -name apksigner -type f | head -1)
          if [ -n "$signer" ]; then
            "$signer" verify --print-certs "$apk" | grep -i "Signer #1 certificate DN" || true
            echo "NOTE: this APK is signed with the debug key and must never be distributed."
          fi
