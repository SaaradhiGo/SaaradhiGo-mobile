# Static analysis and unit tests for the RIDER app.
#
# This repository had no CI, so its ~48 existing tests had never been run
# automatically -- the rider half of a two-sided product was the less-verified half.
# The driver app got CI first; this brings the rider app to the same footing so
# changes to booking, payment and trip state are checked on every push.
#
# `flutter test` needs no secrets and no assets/.env: AppConfig falls back to the QA
# host in debug builds, which is exactly what a test binary is.
name: flutter

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Formatting is checked but not enforced as a failure: a reformat of the
      # whole tree is a separate, reviewable change, not something CI should
      # spring on an unrelated commit.
      - name: Check formatting (informational)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter expanded

  # A build is a different gate from a test.
  #
  # `flutter test` runs on the Dart VM and proves nothing about whether the app
  # compiles for Android: a missing plugin, a Gradle/AGP mismatch, a manifest
  # error or a NDK problem all pass `flutter test` and fail on a device. The
  # previous readiness review had to record "no APK has been produced" as a
  # launch blocker, because the only machine with a toolchain could not build one
  # (Windows requires Developer Mode for the plugin symlinks). A Linux runner has
  # no such restriction.
  #
  # Debug build, deliberately:
  #   * it needs no signing secrets, so this job works on a fork and in a PR;
  #   * android/app/build.gradle.kts already falls back to the debug signing
  #     config when key.properties is absent, so a release build here would be
  #     debug-signed anyway and the name would mislead;
  #   * a store-signed artifact is a release decision, not a CI default.
  #
  # google-services.json is committed, so Firebase messaging links without a
  # secret. The artifact is for technical verification and install-on-a-handset
  # testing. It is NOT a store artifact and must not be submitted.
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Report artifact size
        # A sudden jump in size is usually an accidentally bundled asset.
        run: ls -lh build/app/outputs/flutter-apk/

      - uses: actions/upload-artifact@v4
        with:
          name: rider-debug-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
